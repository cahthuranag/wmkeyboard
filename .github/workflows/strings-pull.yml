# Throwaway: the 0.6.3 strings-pull bundle, on branch strings-pull-0.6.3 only.
# Upload-only retry: takes the AAB run 39784392973 built (versionCode 1000370)
# and keeps offering it to the internal track as a DRAFT until Play's
# translation step stops failing ("languages are not supported for
# translation"), every 20 minutes for up to five hours. Nothing rolls out.
name: Strings pull 0.6.3
on:
  push:
    branches: [strings-pull-0.6.3]
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: strings-pull-bundle
          path: dist
          run-id: 39784392973
          github-token: ${{ github.token }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Upload to internal as a draft
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-key.json
          aab=$(ls dist/*.aab | head -n1)
          for attempt in $(seq 1 15); do
            if bundle exec fastlane run upload_to_play_store json_key:play-key.json \
              package_name:com.wasimaster.wmkeyboard track:internal release_status:draft \
              "aab:$PWD/$aab" skip_upload_apk:true skip_upload_metadata:true \
              skip_upload_changelogs:true skip_upload_images:true skip_upload_screenshots:true; then
              echo "uploaded on attempt $attempt"; exit 0
            fi
            echo "upload attempt $attempt failed at $(date -u +%H:%M)"; sleep 1200
          done
          exit 1
      - name: Wipe key
        if: always()
        run: rm -f play-key.json
