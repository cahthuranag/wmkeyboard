# Throwaway: the 0.6.4 strings-pull bundle. Lives only on branch
# strings-pull-0.6.4, never on main. Builds the Play AAB exactly as
# release.yml's bundle job does, at wmkb.versionCode 100039 (Play 1000390, a
# code no real release will reach), and uploads it to the internal track as a
# DRAFT: Play translates its strings on upload, nothing rolls out.
# Upload-only retry: takes the AAB run 40519584187 built. That run's two
# attempts each died after ~18 minutes on "Connection reset by peer", so this
# one retries 3 minutes after a failure, for up to five and a half hours.
name: Strings pull 0.6.4
on:
  push:
    branches: [strings-pull-0.6.4]
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: strings-pull-bundle
          path: dist
          run-id: 40519584187
          github-token: ${{ github.token }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Upload to internal as a draft
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-key.json
          aab=$(ls dist/*.aab | head -n1)
          ls -l "$aab"
          for attempt in $(seq 1 40); do
            echo "attempt $attempt started at $(date -u +%H:%M)"
            if bundle exec fastlane run upload_to_play_store json_key:play-key.json \
              package_name:com.wasimaster.wmkeyboard track:internal release_status:draft \
              "aab:$PWD/$aab" skip_upload_apk:true skip_upload_metadata:true \
              skip_upload_changelogs:true skip_upload_images:true skip_upload_screenshots:true \
              timeout:3600; then
              echo "uploaded on attempt $attempt at $(date -u +%H:%M)"; exit 0
            fi
            echo "upload attempt $attempt failed at $(date -u +%H:%M)"; sleep 180
          done
          exit 1
      - name: Wipe key
        if: always()
        run: rm -f play-key.json
